; platformio.ini — PlatformIO project configuration for SmartDesk ESP32-S3
;
; Purpose : Build configuration for ESP32-S3 N16R8 with TinyUSB HID,
;           NimBLE BLE, and Adafruit NeoPixel.
; Depends : Nothing.
; Used by : PlatformIO build system.
;
; NOTES ON PLATFORM:
; Arduino-ESP32 core 3.x is provided by the pioarduino fork of the
; official Espressif platform.  The official "espressif32" platform
; still ships core 2.x as of late 2025.  If pioarduino is unavailable
; or the URL below is stale, check:
;   https://github.com/pioarduino/platform-espressif32/releases
; and update the platform line with the correct release ZIP URL.
;
; I AM UNSURE whether the exact release tag below (53.03.13) exists at
; your build time.  If PlatformIO fails to download it, go to the
; releases page above and pick the latest stable ZIP URL.  Alternatively,
; use the git ref:
;   platform = https://github.com/pioarduino/platform-espressif32.git
; which pulls the latest (less reproducible but always works).
;
; USB PORT SETUP:
; The ESP32-S3 DevKitC has TWO USB ports:
;   1. UART port (USB-to-serial chip, e.g. CP2102/CH340) — for upload,
;      serial monitor, and logs.  This is what you plug in for development.
;   2. Native USB port (GPIO19/20) — reserved for TinyUSB HID keyboard.
;      Do NOT use this for logs or upload.
;
; To find your UART COM port:
;   - Plug in ONLY the UART port
;   - Windows: Device Manager → Ports → look for "Silicon Labs" or "CH340"
;   - Set upload_port and monitor_port below to that COM number
;   - The COM number can change if you use a different physical USB port
;
; ENTERING BOOTLOADER (if upload fails):
;   1. Hold the BOOT button on the dev board
;   2. Tap the RST (reset) button while holding BOOT
;   3. Release BOOT
;   4. The board is now in download mode; retry upload
;   This is only needed if the board doesn't auto-enter download mode.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

; ── Memory configuration for N16R8 ───────────────────────────────
; 16MB flash (QIO), 8MB PSRAM (octal/OPI)
; NOTE: I am fairly confident "qio_opi" is correct for N16R8 (quad flash
; + octal PSRAM).  If build fails with PSRAM errors, try "dio_opi" or
; check your specific module's datasheet.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.psram = enabled

; ── Build flags ──────────────────────────────────────────────────
; USB: Use native USB stack (TinyUSB) for HID, NOT CDC.
; Serial logs go through UART (GPIO43/44), not native USB.
build_flags =
    -DARDUINO_USB_MODE=0           ; 0 = TinyUSB stack (not built-in CDC)
    -DARDUINO_USB_CDC_ON_BOOT=0    ; 0 = no CDC serial on native USB
    -DCFG_TUD_HID=1                ; Enable TinyUSB HID device class
    -DBOARD_HAS_PSRAM              ; Enable PSRAM usage
    ; USB device descriptors (shown in Windows Device Manager)
    -DUSB_MANUFACTURER='"SmartDesk"'
    -DUSB_PRODUCT='"SmartDesk HID"'

; ── Serial monitor ───────────────────────────────────────────────
monitor_speed = 115200
; Uncomment and set to your UART COM port:
; upload_port = COM3
; monitor_port = COM3

; ── Library dependencies ─────────────────────────────────────────
; Libraries are placed directly in firmware/lib/ for 100% offline compilation.
; No internet connection or PlatformIO registry lookup needed.
; lib_deps is commented out to prevent PlatformIO from hanging on dependency resolution.
; lib_deps =
;     h2zero/NimBLE-Arduino@^2.1.0
;     adafruit/Adafruit NeoPixel@^1.12.0

; ── Extra settings ───────────────────────────────────────────────
; Increase loop task stack for safety (default 8192 is usually fine)
; board_build.arduino.loop_stack_size = 16384

; Alias environment matching N16R8 naming convention
[env:esp32s3_n16r8]
extends = env:esp32s3


