name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Test & Build Next.js PWA ──────────────────────────────────────────
  pwa-build:
    name: Test & Build PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA Dependencies
        run: |
          cd pwa
          npm ci

      - name: Run Pure Algorithm Unit Tests
        run: |
          cd pwa
          npm run check:pure

      - name: Build Static Export (Next.js)
        run: |
          cd pwa
          npm run build

      - name: Upload Static Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/out/

  # ── Job 2: Deploy to GitHub Pages (Main branch only) ─────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: pwa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

