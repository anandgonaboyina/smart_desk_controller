; PlatformIO Configuration for SmartDesk V2
; Target: ESP32-S3-DevKitC-1 (N16R8)

[platformio]
src_dir = smartdesk

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    adafruit/Adafruit NeoPixel @ ^1.12.0

upload_port = COM6
upload_speed = 921600
monitor_port = COM6
monitor_speed = 115200

